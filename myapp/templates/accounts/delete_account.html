{% extends 'accounts/base.html' %}
{% block body %}
<div class="auth-card" style="max-width: 450px; margin: 2rem auto; text-align: center;">
    <h2>Confirm Account Deletion</h2>
    <p>Are you sure you want to delete your account? This action cannot be undone.</p>
    <form method="POST">
        {% csrf_token %}
        <button type="submit" style="background-color: #dc3545; color: white; padding: 0.5rem 1rem; border: none; border-radius: 4px; cursor: pointer;">Yes, Delete My Account</button>
        <a href="{% url 'profile' %}" style="display: block; margin-top: 1rem;">Cancel</a>
    </form>
</div>
{% endblock %}
