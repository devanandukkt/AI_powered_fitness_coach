{% extends 'accounts/base.html' %}
{% block title %}Login{% endblock %}

{% block body %}
<div class="main-content">
    <div class="auth-card">
        <h2>Login</h2>

        {% if messages %}
          <div class="messages">
            {% for message in messages %}
              <div class="alert alert-{% if message.tags == 'error' %}error{% else %}{{ message.tags }}{% endif %}">
                {{ message }}
              </div>
            {% endfor %}
          </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label for="{{ form.username_or_email.id_for_label }}">Username or Email:</label>
                {{ form.username_or_email }}
            </div>
            <div class="form-group">
                <label for="{{ form.password.id_for_label }}">Password:</label>
                {{ form.password }}
            </div>

            <button type="submit" class="btn-primary">Login</button>

            <div class="auth-links">
                <a href="{% url 'forget_password' %}">Forgot Password?</a>
                <a href="{% url 'register' %}">Create Account</a>
            </div>
        </form>
    </div>
</div>

<script>
    // Replace current history entry with the login URL so the browser can't go back
    if (window.history.replaceState) {
        window.history.replaceState(null, null, window.location.href);
    }

    // Intercept back button clicks and trap navigation on the login page
    window.addEventListener('popstate', function () {
        window.history.pushState(null, null, window.location.href);
    });
</script>
{% endblock %}
